# kind on Docker Desktop. Images are loaded into the node with `kind load`, so there is no registry.
# Everything in docker compose (deploy/infra) is reached through host.docker.internal on its published port.
image:
  tag: local

ingressApi:
  service:
    type: NodePort
    # Must match extraPortMappings in deploy/kubernetes/kind/cluster.yaml: host port 5065, where FakeTeamtailor sends
    # its webhooks.
    nodePort: 30065

otlpEndpoint: http://host.docker.internal:4317
