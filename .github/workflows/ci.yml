name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: write # dorny/test-reporter publishes the "Tests" check

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs the tests too; their results are reported by the separate "Tests" check.
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore -c Release

      # Integration tests start SQL Server, Azurite and the Event Hubs emulator through Testcontainers,
      # using the Docker engine preinstalled on the runner.
      - run: >
          dotnet test --no-build -c Release
          --results-directory ${{ github.workspace }}/TestResults
          --report-xunit-trx --report-xunit-html
          --coverage --coverage-output-format cobertura

      - name: Test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
          # v3 defaults to the job summary only; false creates the check run with annotations.
          use-actions-summary: 'false'

      # Simulators (Fake*) are not part of the product, so +TalentSync.* leaves them out.
      - name: Coverage report
        if: ${{ !cancelled() }}
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/*.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInline;MarkdownSummaryGithub
          assemblyfilters: +TalentSync.*

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            TestResults/*.trx
            TestResults/*.html
            CoverageReport/
