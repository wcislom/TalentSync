name: CI

on:
  pull_request:
    branches: [main]
    # ready_for_review: a draft that becomes ready gets its agent review.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Check formatting
        run: dotnet format --verify-no-changes --no-restore

      # The same check that runs after every edit in Claude Code: forbidden names and direct clock use.
      - name: Check repo rules
        run: bash .claude/hooks/check-rules.sh

  # No tests yet: the Scenarios page has none on purpose (ADR 012); the parking lot tests come with that page.
  admin-web:
    name: Admin app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: src/Admin/TalentSync.Admin.Web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: src/Admin/TalentSync.Admin.Web/.nvmrc
          cache: npm
          cache-dependency-path: src/Admin/TalentSync.Admin.Web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  # Unit tests of the agent flow tools (tools/agent-flow). They run on every PR, like the other checks, because
  # the flow's gates (trust, lock, plan approval) live in this code.
  agent-flow-tests:
    name: Agent flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/agent-flow

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: tools/agent-flow/.nvmrc
          cache: npm
          cache-dependency-path: tools/agent-flow/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

  # Builds again instead of passing bin/ between jobs: a restore and build take under a minute, artifacts of
  # every project's output would be slower and fragile.
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write # dorny/test-reporter publishes the "Test results" check

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Integration tests start SQL Server, Azurite and the Event Hubs emulator through Testcontainers,
      # using the Docker engine preinstalled on the runner.
      - name: Run tests with coverage
        id: tests
        run: >
          dotnet test -c Release
          --results-directory ${{ github.workspace }}/TestResults
          --report-xunit-trx --report-xunit-html
          --coverage --coverage-output-format cobertura

      # Reports run when the tests ran, passed or failed, and are skipped when the step never started.
      - name: Publish test results
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: TestResults/*.trx
          reporter: dotnet-trx
          # v3 defaults to the job summary only; false creates the check run with annotations.
          use-actions-summary: 'false'

      # Simulators (Fake*) are not part of the product, so +TalentSync.* leaves them out.
      - name: Generate coverage report
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: danielpalme/ReportGenerator-GitHub-Action@v5
        with:
          reports: TestResults/*.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInline;MarkdownSummaryGithub
          assemblyfilters: +TalentSync.*

      - name: Add coverage to job summary
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            TestResults/*.trx
            TestResults/*.html
            CoverageReport/

  # The agent's review of a PR (tools/agent-flow/flows/pr-review). It needs Build, so a PR that does not build,
  # is not formatted or breaks a repo rule costs no Claude run. It is not a required check: a Claude outage
  # must not block merges.
  agent-review:
    name: Agent review
    needs: build
    if: >-
      github.event_name == 'pull_request'
      && !github.event.pull_request.draft
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Enough to publish a review. It cannot approve: the repository settings do not allow GitHub Actions to
      # approve pull requests. It cannot merge: the ruleset "Agent branches only" lets only admins change main.
      pull-requests: write

    steps:
      # The tools, the skill and .claude/settings.json come from main, never from the PR. A PR could change them,
      # for example give the skill Bash, and read the Claude token. The skill reads the PR through gh pr diff.
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: tools/agent-flow/.nvmrc
          cache: npm
          cache-dependency-path: tools/agent-flow/package-lock.json

      - name: Install
        run: npm ci
        working-directory: tools/agent-flow

      - name: Review
        run: npm --prefix tools/agent-flow run pr-review "$PULL_REQUEST_NUMBER"
        env:
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # The subscription token from `claude setup-token`, a repository secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
