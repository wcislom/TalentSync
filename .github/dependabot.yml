# One grouped PR per ecosystem and month, so updates do not arrive as a stream of single-package PRs.
# nuget covers Directory.Packages.props (central package versions) and the dotnet-ef tool in dotnet-tools.json.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
